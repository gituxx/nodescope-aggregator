name: Verify nodes

# Collects all public sources, tests every node through a real proxy core (mihomo) and
# publishes only working nodes to the `results` branch. The Cloudflare collector Worker
# pulls results/snapshot.json every hour.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum candidates to test"
        required: false
        default: "40000"

permissions:
  contents: write

concurrency:
  group: verify-nodes
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MIHOMO_VERSION: v1.19.33
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous results
        run: |
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git fetch --depth=1 origin results
            mkdir -p results
            git --work-tree=results checkout origin/results -- .
            git reset -q
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install mihomo
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip -f mihomo.gz && chmod +x mihomo && ./mihomo -v

      - name: Raise file descriptor limit
        run: ulimit -n 65535 || true

      - name: Verify
        run: |
          ulimit -n 65535 || true
          node scripts/verify.mjs --mihomo ./mihomo --out ./results --limit "${{ github.event.inputs.limit || '40000' }}"

      - name: Publish results branch
        run: |
          cd results
          rm -rf .git
          git init -q -b results
          git config user.name "nodescope-bot"
          git config user.email "nodescope-bot@users.noreply.github.com"
          cat > README.md <<'EOF'
          # NodeScope verified results

          Generated by `.github/workflows/verify.yml`. Every node here passed a real proxy
          handshake + HTTP test and an exit-IP trace from a GitHub Actions runner.

          - `snapshot.json` – full snapshot consumed by the Cloudflare Worker
          - `nodes.txt` / `nodes.b64` – plain / Base64 subscription of all verified nodes
          - `stats.json` – run statistics and source health
          - `history.json` – rolling per-node pass/fail history used for stability scores
          EOF
          git add -A
          git commit -q -m "Verified snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # Single-commit branch: avoids growing repository history every run.
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" results
